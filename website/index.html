.zz-card{transition:transform .2s ease,border-color .2s ease,background-color .2s ease}

.zz-hero{position:relative}
.zz-hero::before{content:"";position:absolute;left:0;right:0;top:-30px;height:max(50vw,700px);background:url(assets/img/bg-hero.webp) center top/cover no-repeat;-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 62%,transparent 100%);mask-image:linear-gradient(180deg,#000 0%,#000 62%,transparent 100%);z-index:0;pointer-events:none}

/* ---- effects ---- */
.zz-hero::before{translate:calc(var(--mx,0) * -16px) calc(var(--my,0) * -10px);transition:translate .8s cubic-bezier(.2,.7,.2,1)}
.zz-tilt{transform:perspective(1400px) rotateY(calc(var(--mx,0) * 5deg)) rotateX(calc(var(--my,0) * -4deg));transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.zz-panda{translate:calc(var(--mx,0) * 16px) calc(var(--my,0) * 8px);transition:translate .6s cubic-bezier(.2,.7,.2,1);transform-origin:50% 100%;animation:zzbreathe 3.8s ease-in-out infinite}
@keyframes zzbreathe{0%,100%{scale:1 1}50%{scale:1.012 1.035}}
.zz-star{position:absolute;pointer-events:none;z-index:1;animation:zztw 3.2s ease-in-out infinite}
@keyframes zztw{0%,100%{opacity:.2;scale:.6}50%{opacity:1;scale:1}}
.zz-shoot{position:absolute;top:70px;left:-160px;width:150px;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(255,246,214,0),#FFF6D6);opacity:0;z-index:1;pointer-events:none;animation:zzshoot 11s ease-in 2.5s infinite}
@keyframes zzshoot{0%{opacity:0;transform:translate(0,0) rotate(16deg)}2%{opacity:1}10%{opacity:0;transform:translate(min(70vw,900px),min(20vw,260px)) rotate(16deg)}100%{opacity:0;transform:translate(min(70vw,900px),min(20vw,260px)) rotate(16deg)}}
.zz-card img{transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.zz-card:hover img{transform:translateY(-6px) rotate(-5deg) scale(1.06)}
@supports (animation-timeline: view()){
.zz-hero::before{animation:zzbg linear both;animation-timeline:scroll(root);animation-range:0 900px}
@keyframes zzbg{to{transform:translateY(300px)}}
.zz-panda{animation:zzbreathe 3.8s ease-in-out infinite,zzpandaup linear both;animation-timeline:auto,scroll(root);animation-range:normal,0 700px}
@keyframes zzpandaup{to{transform:translateY(-50px)}}
.zz-reveal{animation:zzreveal linear both;animation-timeline:view();animation-range:entry 0% entry 70%}
.zz-reveal:nth-child(2){animation-range:entry 8% entry 78%}
.zz-reveal:nth-child(3){animation-range:entry 16% entry 86%}
.zz-reveal:nth-child(4){animation-range:entry 24% entry 94%}
.zz-reveal:nth-child(5){animation-range:entry 32% cover 30%}
@keyframes zzreveal{from{opacity:0;translate:0 48px;scale:.96}to{opacity:1;translate:0 0;scale:1}}
.zz-foot-panda{animation:zzfootup linear both;animation-timeline:view();animation-range:entry 0% cover 40%}
@keyframes zzfootup{from{opacity:0;transform:translateY(60px) rotate(-4deg)}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion:reduce){.zz-hero::before,.zz-panda,.zz-reveal,.zz-foot-panda,.zz-star,.zz-shoot{animation:none!important}.zz-shoot{display:none}.zz-tilt{transform:none}.zz-card:hover img{transform:none}}

    var t = ZZ_T[state.lang];
    var items = ZZ_FORMATS.map(function (f) { return [f, f]; }).concat([['···', t.more]]);
    $('zz-formats').innerHTML = items.map(function (x) { return '<li title="' + esc(x[1]) + '" style="padding:0 16px;height:36px;display:inline-flex;align-items:center;border-radius:999px;background:#E9E2FF;color:#33207A;font-family:\'Fredoka\',sans-serif;font-weight:700;font-size:16px">' + esc(x[0]) + '</li>'; }).join('');
  }
  var copied = false;
  function applyLang() {
    var t = ZZ_T[state.lang];
    document.documentElement.lang = state.lang;
    document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t[el.getAttribute('data-i18n')]; });
    document.querySelectorAll('[data-i18n-aria]').forEach(function (el) { el.setAttribute('aria-label', t[el.getAttribute('data-i18n-aria')]); });
    document.querySelectorAll('[data-lang]').forEach(function (b) {
      var on = b.getAttribute('data-lang') === state.lang;
      b.setAttribute('aria-pressed', on); b.style.background = on ? '#5B3FD0' : 'transparent'; b.style.color = on ? '#FFFFFF' : '#CFC4F3';
    });
    $('zz-copymsg').textContent = copied ? t.copied : t.buildNote;
    renderFormats();
    var shot = $('zz-shot');
    if (shot) { shot.src = 'assets/img/screenshot-' + state.lang + '.webp'; shot.alt = t.shotAlt; }
  }

  document.querySelectorAll('[data-lang]').forEach(function (b) {
    b.addEventListener('click', function () { state.lang = b.getAttribute('data-lang'); try { localStorage.setItem('zzzip-lang', state.lang); } catch (e) {} applyLang(); });
  });
  var timer;
  $('zz-copy').addEventListener('click', function () {
    var txt = 'git clone https://github.com/MrGamingITA/zzzip.git \\\n&& cd zzzip && ./scripts/install.sh';
    try { if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(function () {}); } catch (e) {}
    copied = true; $('zz-copy-ico').style.display = 'none'; $('zz-copied-ico').style.display = '';
    $('zz-copymsg').textContent = ZZ_T[state.lang].copied;
    clearTimeout(timer);
    timer = setTimeout(function () { copied = false; $('zz-copy-ico').style.display = ''; $('zz-copied-ico').style.display = 'none'; $('zz-copymsg').textContent = ZZ_T[state.lang].buildNote; }, 2000);
  });
  // mouse parallax on hero
  var hero = $('zz-hero'), raf = 0;
  hero.addEventListener('mousemove', function (e) {
    var cx = e.clientX, cy = e.clientY; if (raf) return;
    raf = requestAnimationFrame(function () {
      raf = 0; var r = hero.getBoundingClientRect();
      hero.style.setProperty('--mx', Math.max(-0.5, Math.min(0.5, (cx - r.left) / r.width - 0.5)).toFixed(3));
      hero.style.setProperty('--my', Math.max(-0.5, Math.min(0.5, (cy - r.top) / r.height - 0.5)).toFixed(3));
    });
  });
  hero.addEventListener('mouseleave', function () { hero.style.setProperty('--mx', '0'); hero.style.setProperty('--my', '0'); });

  applyLang();
})();
</script>
</body>
</html>
