# Publishes the website/ folder to GitHub Pages.
# Enable once in Settings ▸ Pages ▸ Source: "GitHub Actions" (needs a public repo on the free plan),
# It then publishes automatically on every change to website/ (release.sh bumps the version there).
name: Website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["website/**"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
